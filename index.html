<style>
/* Two levels: a horizontal shelf of consoles, then a vertical grid of that console's games. */
:root{
  --bg:#131417; --surface:#1c1d22; --raised:#25272e; --line:#2f323a;
  --fg:#f1f1ef; --muted:#9a9ca5; --accent:#f2b84b;
  --display:"Archivo", "Helvetica Neue", system-ui, sans-serif;
  --body:"Inter", -apple-system, system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px;
  display:flex;align-items:center;gap:14px;border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .count{color:var(--muted);font-size:15px;font-weight:500;margin-left:8px}
.back{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:16px;padding:8px 10px 8px 0}
.back svg{width:20px;height:20px}
.link{color:var(--muted);font-size:14px;font-weight:500;padding:8px 0}
.link:active{color:var(--fg)}

/* console shelf */
.shelf{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(24px,env(safe-area-inset-left,0px));
  padding-block:18px 26px;padding-inline:max(24px,env(safe-area-inset-left,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf::-webkit-scrollbar{display:none}
.console{flex:none;width:min(280px,72vw);scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:14px}
.console .plate{aspect-ratio:1/1;border-radius:22px;background:var(--tint);display:grid;place-items:center;overflow:hidden;
  transition:transform .2s ease}
.console .plate svg{width:78%;height:auto;max-width:100%}
.console:active .plate{transform:scale(.97)}
.console .name{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.console .sub{color:var(--muted);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.section-label{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0}

/* games */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 20px;padding-top:18px}
.game{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;min-width:0}
.art{aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface);display:grid;place-items:center;
  transition:transform .15s ease}
.art img{width:100%;height:100%;object-fit:cover}
.game:active .art{transform:scale(.96)}
.fallback{padding:16px;width:100%;height:100%;display:flex;align-items:flex-end;background:var(--raised);
  font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
.gtitle{font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.region{color:var(--muted);font-size:12px;margin-top:-6px}

/* empty state */
.empty{max-width:520px;padding-block:10vh 0}
.empty h2{font-family:var(--display);font-size:26px;margin:0 0 10px}
.empty p{color:var(--muted);line-height:1.6;margin:0 0 22px}
.empty ol{color:var(--muted);line-height:1.7;padding-left:20px;margin:0 0 26px}
.empty b{color:var(--fg);font-weight:600}
.primary{background:var(--accent);color:#1a1408;font-weight:600;font-size:16px;padding:14px 22px;border-radius:12px;display:inline-block;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);
  padding:12px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 48px);z-index:20}
@media (prefers-reduced-motion:reduce){.console .plate,.art{transition:none}}
</style>
</head>

<header class="bar wrap" id="bar"></header>

<input id="lpl" type="file" multiple hidden>

  ["Nintendo - Game Boy Color","Game Boy Color","gbc","#3a2b55"],
  ["Nintendo - Game Boy Advance","Game Boy Advance","gba","#2a2d55"],
  ["Nintendo - Nintendo DS","Nintendo DS","nds","#2c3440"],
  ["Nintendo - Virtual Boy","Virtual Boy","vb","#3e1f22"],
  ["Sega - Master System - Mark III","Master System","sms","#3a2224"],
  ["Sega - Mega Drive - Genesis","Mega Drive","md","#3a2224"],
  ["Sega - Dreamcast","Dreamcast","dc","#3a2b24"],
  ["NEC - PC Engine - TurboGrafx 16","PC Engine","pce","#3d2a26"],
  ["Sony - PlayStation","PlayStation","ps1","#2b2f38"],
  ["FBNeo - Arcade Games","Arcade","arcade","#22284a"],
  ["MAME","Arcade","arcade","#22284a"]
];
const SYS = Object.fromEntries(SYSTEMS.map((s,i)=>[s[0],{short:s[1],art:s[2],tint:s[3],order:i}]));
function info(name){ return SYS[name] || {short:name.replace(/^.*? - /,""),art:"other",tint:"#2c2e36",order:999}; }
function svg(key){ return `<svg viewBox="0 0 200 200" aria-hidden="true">${ART[key]||ART.other}</svg>`; }

let library = load();
let view = null; // null = shelf, otherwise system name

function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):[] }catch(e){ return [] } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(library)) }catch(e){} }

function thumbURL(system,label){
  const clean = label.replace(/[&*\/:`<>?\\|"]/g,"_");
  return "https://thumbnails.libretro.com/"+encodeURIComponent(system)+"/Named_Boxarts/"+encodeURIComponent(clean)+".png";
}
function fileOf(path){ return (path||"").split("#")[0].split(/[\\/]/).pop(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function splitTitle(label){ const m=label.match(/^(.*?)\s*(\(.*)$/); return m?[m[1],m[2].replace(/[()]/g,"").replace(/\s+/g," ")]:[label,""]; }

const bar=document.getElementById("bar"), main=document.getElementById("main");

function render(){
  window.scrollTo(0,0);
  const sys = view && library.find(s=>s.system===view);
  if(!sys){ view=null; renderShelf(); } else renderGames(sys);
}

function renderShelf(){
  bar.innerHTML = `<h1>Arcade Shelf</h1>${library.length?'<button class="link" id="reload">Update library</button>':''}`;
  if(!library.length){
    main.innerHTML = `<div class="wrap"><div class="empty">
      <h2>Add your games</h2>
      <p>Arcade Shelf reads the game lists RetroArch already keeps, so it shows exactly what you have imported there.</p>
      <ol>
        <li>Tap <b>Choose playlists</b>.</li>
        <li>Go to <b>On My iPad › RetroArch › playlists</b>.</li>
        <li>Select every <b>.lpl</b> file and tap Open.</li>
      </ol>
      <label class="primary" for="lpl">Choose playlists</label>
    </div></div>`;
    return;
  }
  const items = library.map(s=>{ const i=info(s.system); return `
    <button class="console" data-sys="${esc(s.system)}" style="--tint:${i.tint}">
      <div class="plate">${svg(i.art)}</div>
      <div><div class="name">${esc(i.short)}</div><div class="sub">${s.games.length} ${s.games.length===1?"game":"games"}</div></div>
    </button>`; }).join("");
  main.innerHTML = `<div class="wrap"><p class="section-label">Consoles</p></div><div class="shelf" id="shelf">${items}</div>`;
  main.querySelectorAll(".console").forEach(b=>b.onclick=()=>{ view=b.dataset.sys; history.pushState({v:view},""); render(); });
  const r=document.getElementById("reload"); if(r) r.onclick=()=>document.getElementById("lpl").click();
}

function renderGames(sys){
  const i=info(sys.system);
  bar.innerHTML = `<button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Consoles</button>
    <h1>${esc(i.short)}<span class="count">${sys.games.length}</span></h1>`;
  document.getElementById("back").onclick=()=>history.back();
  const grid = document.createElement("div"); grid.className="grid";
  sys.games.forEach(g=>{
    const [name,region]=splitTitle(g.label);
    const a=document.createElement("a"); a.className="game"; a.href="retroarch://game/"+encodeURIComponent(g.file);
    a.innerHTML=`<div class="art"></div><div class="gtitle">${esc(name)}</div>${region?`<div class="region">${esc(region)}</div>`:""}`;
    const art=a.firstChild, img=new Image(); img.loading="lazy"; img.alt=""; img.src=thumbURL(sys.system,g.label);
    img.onerror=()=>{ art.innerHTML=`<div class="fallback">${esc(name)}</div>`; };
    art.appendChild(img); grid.appendChild(a);
  });
  main.innerHTML=""; const w=document.createElement("div"); w.className="wrap"; w.appendChild(grid); main.appendChild(w);
}

window.addEventListener("popstate",()=>{ view=(history.state&&history.state.v)||null; render(); });
window.addEventListener("scroll",()=>bar.classList.toggle("scrolled",scrollY>4),{passive:true});

let tt; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3000); }

document.getElementById("lpl").addEventListener("change", async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const next=[...library]; let added=0; const bad=[];
  for(const f of files){
    try{
      const data=JSON.parse(await f.text());
      const fallback=f.name.replace(/\.lpl$/i,"");
      const by={};
      (data.items||[]).forEach(it=>{
        const s=(it.db_name||"").replace(/\.lpl$/i,"")||fallback;
        (by[s] ||= []).push({label:it.label||fileOf(it.path).replace(/\.[^.]+$/,""), file:fileOf(it.path)});
      });
      for(const [s,games] of Object.entries(by)){
        games.sort((a,b)=>a.label.localeCompare(b.label));
        const i=next.findIndex(x=>x.system===s);
        if(i>=0) next[i]={system:s,games}; else next.push({system:s,games});
        added+=games.length;
      }
    }catch(err){ bad.push(f.name); }
  }
  library=next.sort((a,b)=>info(a.system).order-info(b.system).order || a.system.localeCompare(b.system));
  save(); view=null; history.replaceState({v:null},""); render();
  toast(bad.length?`Couldn't read ${bad.join(", ")}. Pick the .lpl files in RetroArch › playlists.`:`Loaded ${added} games`);
  e.target.value="";
});

history.replaceState({v:null},"");
render();
</script>
</body>
</html>
