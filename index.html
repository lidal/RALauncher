<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Shelf</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade Shelf">
<meta name="theme-color" content="#141414">
<meta name="app-version" content="2.1.0">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="icon" href="img/icon.png">
<style>
/* Controller-first launcher for RetroArch. Two screens: pick a console, pick a game. */
:root{
  --bg:#141414; --fg:#f2f2f2; --muted:#8e8e8e; --faint:#2a2a2a;
  --font:-apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --sl:max(32px,env(safe-area-inset-left,0px)); --sr:max(32px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.app{overflow:hidden;position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{-webkit-user-drag:none}

/* the focused game's screenshot, faint and unblurred, pixels kept sharp */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg div{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;opacity:0;transition:opacity .5s ease}
#bg div.on{opacity:.07}

.screen{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto 1fr auto}

.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--sr) 0 var(--sl);min-height:54px;font-size:17px}
.top h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .n{color:var(--muted);font-weight:400;margin-left:8px}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:-8px;border-radius:17px;flex:none}
.back:active{background:var(--faint)}
.back svg{width:20px;height:20px}
.spacer{flex:1}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}

.stage{position:relative;min-height:0;overflow:hidden}

/* ---------- consoles ---------- */
.consoles{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto}
.carousel{position:relative;min-height:0}
.cons{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--chh);margin:calc(var(--chh) / -2) 0 0 calc(var(--cw) / -2);
  transform-origin:50% 50%;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s ease;cursor:pointer}
.cons img{width:100%;height:100%;object-fit:contain;display:block}
.cons .noimg{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--chh) * .14);font-weight:700;color:#3a3a3a;text-align:center}
.caption{text-align:center;padding:0 var(--sr) 20px var(--sl);min-height:88px}
.caption h2{font-size:clamp(26px,3.4vh + 1vw,40px);font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.caption p{margin:0;color:var(--muted);font-size:17px}

/* ---------- games ---------- */
.games{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:2vh}
.row{position:relative;flex:none;height:var(--rowh)}
.track{position:absolute;left:0;top:50%;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.jump{transition:none}
.tile{position:absolute;top:0;transform:translateY(-50%);cursor:pointer}
.tile .art{width:100%;height:100%;border-radius:6px;overflow:hidden;background:#222;opacity:.45;transition:opacity .25s ease}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .fb{width:100%;height:100%;display:flex;align-items:flex-end;padding:10%;font-weight:700;line-height:1.1;color:#ddd;background:#262626;font-size:var(--fbs)}
.tile.on .art{opacity:1}
.tile.on::after{content:"";position:absolute;inset:-7px;border:3px solid var(--fg);border-radius:11px}
.info{padding:6px var(--sr) 0 var(--sl);min-height:80px}
.info h2{font-size:clamp(24px,3vh + .9vw,36px);font-weight:700;letter-spacing:-.02em;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{margin:0;color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.letter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:20px;background:rgba(20,20,20,.94);
  border:1px solid #333;display:grid;place-items:center;font-size:64px;font-weight:700;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:3}
.letter.on{opacity:1;transition:none}

/* ---------- bottom bar ---------- */
.bottom{display:flex;align-items:center;gap:24px;padding:8px var(--sr) calc(14px + env(safe-area-inset-bottom,0px)) var(--sl);
  color:var(--muted);font-size:15px;min-height:50px}
.bottom .h{display:flex;align-items:center;gap:8px;white-space:nowrap}
.g{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;line-height:1}
.g.sq{border-radius:6px}
.g svg{width:14px;height:14px}
.textbtn{color:var(--muted);font-size:15px;padding:6px 0}
.textbtn:active{color:var(--fg)}
.ver{color:#555;font-size:13px}

.launch{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s ease;text-align:center}
.launch.on{opacity:1;pointer-events:auto}
.launch p{margin:0 0 6px;color:var(--muted);font-size:17px}
.launch h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;padding:0 32px}

/* ---------- first run ---------- */
.empty{position:fixed;inset:0;z-index:1;overflow:auto;-webkit-user-select:text;user-select:text;
  padding:calc(48px + env(safe-area-inset-top,0px)) var(--sr) 48px var(--sl);display:flex;align-items:center;justify-content:center;gap:6vw}
.empty>div{flex:1 1 0;max-width:460px}
.empty img{flex:1 1 0;min-width:0;max-width:440px;height:auto}
.empty h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.empty p{color:var(--muted);line-height:1.5;margin:0 0 16px;font-size:17px}
.empty ol{color:var(--muted);line-height:1.8;padding-left:22px;margin:0 0 28px;font-size:17px}
.empty b{color:var(--fg);font-weight:600}
.primary{background:var(--fg);color:var(--bg);font-weight:600;font-size:17px;padding:13px 22px;border-radius:12px;display:inline-block;cursor:pointer}
@media (max-aspect-ratio:1/1){.empty img{display:none}}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#2a2a2a;
  padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100vw - 48px);z-index:20}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bg"><div id="snapA"></div><div id="snapB"></div></div>
<div id="root"></div>
<input id="lpl" type="file" multiple hidden>
<div class="launch" id="launch"><div><p>Starting</p><h2 id="launchTitle"></h2></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Bump on every change (tools/bump-version.sh does it). Open apps notice and reload themselves. */
const APP_VERSION = "2.1.0";
const KEY = "arcade-shelf-library-v2", UIKEY = "arcade-shelf-ui-v1";

/* libretro playlist name -> display name, console photo, box art shape (width / height) */
const SYSTEMS = [
  ["Nintendo - Nintendo Entertainment System","NES","nes",.72],
  ["Nintendo - Family Computer Disk System","Famicom Disk System","fds",.72],
  ["Nintendo - Super Nintendo Entertainment System","Super Nintendo","snes",1.38],
  ["Nintendo - Nintendo 64","Nintendo 64","n64",1.38],
  ["Nintendo - GameCube","GameCube","gc",.71],
  ["Nintendo - Game Boy","Game Boy","gb",.98],
  ["Nintendo - Game Boy Color","Game Boy Color","gbc",.98],
  ["Nintendo - Game Boy Advance","Game Boy Advance","gba",.98],
  ["Nintendo - Nintendo DS","Nintendo DS","nds",.9],
  ["Nintendo - Virtual Boy","Virtual Boy","vb",.72],
  ["Sega - Master System - Mark III","Master System","sms",.72],
  ["Sega - Mega Drive - Genesis","Mega Drive","md",.7],
  ["Sega - Dreamcast","Dreamcast","dc",.9],
  ["NEC - PC Engine - TurboGrafx 16","PC Engine","pce",.9],
  ["Sony - PlayStation","PlayStation","ps1",1],
  ["FBNeo - Arcade Games","Arcade","arcade",.75],
  ["MAME","Arcade","arcade",.75]
];
/* flat system icons in img/systems: RetroArch "Retrosystem" theme, CC BY 4.0 (see img/systems/CREDITS.md) */
const ICONS = new Set(["nes","fds","snes","n64","gc","gb","gbc","gba","nds","vb","sms","md","dc","pce","ps1","arcade"]);
const SYS = Object.fromEntries(SYSTEMS.map((s,i)=>[s[0],{short:s[1],img:s[2],ar:s[3],order:i}]));
function info(name){ return SYS[name] || {short:name.replace(/^.*? - /,""),img:null,ar:.75,order:999}; }
function photo(key){ return key && ICONS.has(key) ? `img/systems/${key}.svg` : null; }

/* ---------- data ---------- */
let library = load();
let ui = loadUI();
let view = "consoles";
let ci = Math.max(0, library.findIndex(s=>s.system===ui.sys));
let gi = 0;

function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):[] }catch(e){ return [] } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(library.map(({system,games})=>({system,games})))) }catch(e){} }
function loadUI(){ try{ return JSON.parse(localStorage.getItem(UIKEY))||{pos:{}} }catch(e){ return {pos:{}} } }
function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify(ui)) }catch(e){} }

function thumbURL(system,label,kind="Named_Boxarts"){
  const clean = label.replace(/[&*\/:`<>?\\|"]/g,"_");
  return "https://thumbnails.libretro.com/"+encodeURIComponent(system)+"/"+kind+"/"+encodeURIComponent(clean)+".png";
}
function fileOf(path){ return (path||"").split("#")[0].split(/[\\/]/).pop(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function splitTitle(label){ const m=label.match(/^(.*?)\s*([(\[].*)$/); return m?[m[1], m[2].split(/[()\[\]]/).map(s=>s.trim()).filter(Boolean)]:[label,[]]; }
function letterOf(label){ const c=label.replace(/^(the|a)\s+/i,"").trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:"#"; }
const failed = new Set();
const sys = ()=>library[ci];
const $ = id=>document.getElementById(id);

/* ---------- controller glyphs ---------- */
let padKind = null; // null | "xbox" | "ps" | "nintendo"
function glyph(btn){
  const L={xbox:{A:"A",B:"B",LB:"LB",RB:"RB"}, ps:{A:"✕",B:"○",LB:"L1",RB:"R1"}, nintendo:{A:"B",B:"A",LB:"L",RB:"R"}}[padKind];
  if(btn==="dpad") return `<span class="g"><svg viewBox="0 0 16 16"><path d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5z" fill="currentColor"/></svg></span>`;
  if(btn==="LR") return `<span class="g sq">${L.LB}</span><span class="g sq">${L.RB}</span>`;
  return `<span class="g">${L[btn]}</span>`;
}

/* ---------- rendering ---------- */
let els = {};

function render(){
  document.body.classList.toggle("app", !!library.length);
  if(!library.length) return renderEmpty();
  if(ci>=library.length) ci=0;
  $("root").innerHTML = `
  <div class="screen">
    <header class="top" id="top"></header>
    <main class="stage" id="stage"></main>
    <footer class="bottom" id="bottom"></footer>
  </div>`;
  els = {top:$("top"), stage:$("stage"), bottom:$("bottom")};
  view==="games" ? buildGames() : buildConsoles();
}

function renderEmpty(){
  $("root").innerHTML = `<div class="empty">
    <div>
      <h1>Arcade Shelf</h1>
      <p>A launcher for the games you've already added to RetroArch. It reads RetroArch's playlists, so there's nothing else to set up.</p>
      <ol>
        <li>Tap <b>Choose playlists</b>.</li>
        <li>Go to <b>On My iPad › RetroArch › playlists</b>.</li>
        <li>Select every <b>.lpl</b> file and tap Open.</li>
      </ol>
      <label class="primary" for="lpl">Choose playlists</label>
    </div>
    <img src="img/systems/snes.svg" alt="">
  </div>`;
}

function clockHTML(){ return `<span class="clock" id="clock">${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>`; }

function bottomBar(hints, withLibrary){
  els.hints=hints; els.withLibrary=withLibrary;
  els.bottom.innerHTML = (withLibrary?`<button class="textbtn" id="reload">Update library</button><span class="ver">v${APP_VERSION}</span>`:"")
    + `<div class="spacer"></div>` + (padKind ? hints.map(([g,t])=>`<span class="h">${glyph(g)}${t}</span>`).join("") : "");
  const r=$("reload"); if(r) r.onclick=()=>$("lpl").click();
}

/* --- consoles --- */
function buildConsoles(){
  view="consoles"; setSnap(null);
  els.top.innerHTML = `<h1>Consoles</h1><div class="spacer"></div>${clockHTML()}`;
  els.stage.innerHTML = `<section class="consoles">
      <div class="carousel" id="carousel">${library.map((s,i)=>{ const p=photo(info(s.system).img);
        return `<div class="cons" data-i="${i}">${p?`<img src="${p}" alt="" onerror="this.outerHTML='<div class=noimg>${esc(info(s.system).short)}</div>'">`:`<div class="noimg">${esc(info(s.system).short)}</div>`}</div>`; }).join("")}</div>
      <div class="caption" id="caption"></div>
    </section>`;
  els.carousel=$("carousel"); els.caption=$("caption");
  els.carousel.querySelectorAll(".cons").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(i===ci) input("ok"); else { ci=i; updateConsoles(); } });
  bottomBar([["dpad","Choose"],["A","Open"]], true);
  sizeConsoles(); updateConsoles();
}
function sizeConsoles(){
  const h=els.carousel.clientHeight, w=els.carousel.clientWidth;
  els.ch = Math.min(h*1.05, w*.4); els.cw = els.ch;
  els.carousel.style.setProperty("--cw", els.cw+"px");
  els.carousel.style.setProperty("--chh", els.ch+"px");
}
function updateConsoles(){
  const cw=els.cw;
  els.carousel.querySelectorAll(".cons").forEach(el=>{
    const o=+el.dataset.i-ci, a=Math.abs(o);
    const x = a===0?0:Math.sign(o)*cw*(.86+(a-1)*.56);
    el.style.transform=`translateX(${x}px) scale(${a===0?1:.56})`;
    el.style.opacity = a===0?1:a===1?.4:a===2?.14:0;
    el.style.zIndex = 10-a;
  });
  const s=sys();
  els.caption.innerHTML = `<h2>${esc(info(s.system).short)}</h2><p>${s.games.length} ${s.games.length===1?"game":"games"}</p>`;
  ui.sys=s.system; saveUI();
}

/* --- games --- */
const WIN = 12;
function buildGames(){
  view="games";
  const s=sys(), i=info(s.system);
  gi = Math.min(ui.pos[s.system]||0, s.games.length-1);
  s.keys = s.games.map(g=>letterOf(g.label));
  els.top.innerHTML = `<button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1>${esc(i.short)}<span class="n">${s.games.length}</span></h1><div class="spacer"></div>${clockHTML()}`;
  $("back").onclick=()=>input("back");
  els.stage.innerHTML = `<section class="games">
      <div class="row" id="row"><div class="track" id="track"></div><div class="letter" id="letter"></div></div>
      <div class="info" id="info"><h2 id="title"></h2><p id="details"></p></div>
    </section>`;
  Object.assign(els,{row:$("row"),track:$("track"),letter:$("letter"),info:$("info"),title:$("title"),details:$("details")});
  els.tiles=new Map();
  els.track.onclick=e=>{ const t=e.target.closest(".tile"); if(!t) return; const k=+t.dataset.i; if(k===gi) input("ok"); else { gi=k; updateGames(); } };
  bottomBar([["dpad","Browse"],["LR","Jump to letter"],["A","Play"],["B","Back"]], false);
  sizeGames(); updateGames(true);
}
function sizeGames(){
  const H=els.stage.clientHeight-100, W=els.row.clientWidth, ar=info(sys().system).ar;
  els.th = Math.round(Math.min(H*.8, 380));
  els.tw = Math.round(els.th*ar);
  if(els.tw > W*.32){ els.tw=Math.round(W*.32); els.th=Math.round(els.tw/ar); }
  els.step = els.tw + Math.round(Math.max(18, els.th*.08));
  els.row.style.setProperty("--rowh", (els.th+36)+"px");
  els.pad = parseFloat(getComputedStyle(els.info).paddingLeft)||32;
  els.tiles.forEach(el=>el.remove()); els.tiles.clear();
}
function tileEl(k){
  const s=sys(), g=s.games[k], [name]=splitTitle(g.label);
  const el=document.createElement("div");
  el.className="tile"; el.dataset.i=k;
  el.style.cssText=`left:${k*els.step}px;width:${els.tw}px;height:${els.th}px`;
  el.innerHTML=`<div class="art"></div>`;
  const art=el.firstChild, url=thumbURL(s.system,g.label);
  const fb=()=>{ art.innerHTML=`<div class="fb" style="--fbs:${Math.max(13,Math.round(els.th*.07))}px">${esc(name)}</div>`; };
  if(failed.has(url)) fb(); else {
    const img=new Image(); img.alt=""; img.decoding="async"; img.draggable=false;
    img.onerror=()=>{ failed.add(url); fb(); };
    img.src=url; art.appendChild(img);
  }
  return el;
}
let snapTimer, letterTimer;
function updateGames(first){
  const s=sys(), n=s.games.length, g=s.games[gi];
  for(const [k,el] of els.tiles) if(Math.abs(k-gi)>WIN){ el.remove(); els.tiles.delete(k); }
  for(let k=Math.max(0,gi-WIN);k<=Math.min(n-1,gi+WIN);k++) if(!els.tiles.has(k)){ const el=tileEl(k); els.tiles.set(k,el); els.track.appendChild(el); }
  for(const [k,el] of els.tiles) el.classList.toggle("on",k===gi);
  /* focus sits one tile in from the left edge (first tile: at the edge), like a console home screen */
  const x = els.pad + Math.min(gi,1)*els.step - gi*els.step;
  els.track.classList.toggle("jump",!!first);
  els.track.style.transform=`translateX(${x}px)`;
  if(first) requestAnimationFrame(()=>els.track.classList.remove("jump"));

  const [name,tags]=splitTitle(g.label);
  els.title.textContent=name;
  els.details.textContent=[tags.join(", "), `${gi+1} of ${n}`].filter(Boolean).join("  ·  ");
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>setSnap(thumbURL(s.system,g.label,"Named_Snaps")), first?0:200);
  ui.pos[s.system]=gi; saveUI();
}
let snapFlip=false, snapWant=null;
function setSnap(url){
  snapWant=url;
  const a=$("snapA"), b=$("snapB");
  if(!url || failed.has(url)){ a.classList.remove("on"); b.classList.remove("on"); return; }
  const img=new Image();
  img.onload=()=>{ if(snapWant!==url) return; snapFlip=!snapFlip; const show=snapFlip?a:b, hide=snapFlip?b:a;
    show.style.backgroundImage=`url("${url}")`; show.classList.add("on"); hide.classList.remove("on"); };
  img.onerror=()=>{ failed.add(url); if(snapWant===url){ a.classList.remove("on"); b.classList.remove("on"); } };
  img.src=url;
}
function showLetter(){
  els.letter.textContent=sys().keys[gi]; els.letter.classList.add("on");
  clearTimeout(letterTimer); letterTimer=setTimeout(()=>els.letter.classList.remove("on"),450);
}

/* ---------- input ---------- */
let launching=false;
function input(a){
  if(launching || !library.length) return;
  if(view==="consoles"){
    if(a==="left"&&ci>0){ ci--; updateConsoles(); }
    else if(a==="right"&&ci<library.length-1){ ci++; updateConsoles(); }
    else if(a==="ok"){ history.pushState({v:"games"},""); buildGames(); }
  } else {
    const s=sys(), n=s.games.length;
    if(a==="left"&&gi>0){ gi--; updateGames(); }
    else if(a==="right"&&gi<n-1){ gi++; updateGames(); }
    else if(a==="next"||a==="down"){ const k=s.keys[gi]; let j=gi; while(j<n&&s.keys[j]===k) j++; if(j<n){ gi=j; updateGames(); showLetter(); } }
    else if(a==="prev"||a==="up"){ let j=gi; const k=s.keys[gi]; if(j>0&&s.keys[j-1]===k){ while(j>0&&s.keys[j-1]===k) j--; } else if(j>0){ j--; const k2=s.keys[j]; while(j>0&&s.keys[j-1]===k2) j--; } if(j!==gi){ gi=j; updateGames(); showLetter(); } }
    else if(a==="ok") launch();
    else if(a==="back") history.back();
  }
}
function launch(){
  const g=sys().games[gi], [name]=splitTitle(g.label);
  launching=true;
  $("launchTitle").textContent=name; $("launch").classList.add("on");
  setTimeout(()=>{ location.href="retroarch://game/"+encodeURIComponent(g.file); }, 250);
  setTimeout(endLaunch, 2500);
}
function endLaunch(){ if(!launching) return; launching=false; $("launch").classList.remove("on"); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ endLaunch(); padReset(); checkForUpdate(); } });

window.addEventListener("popstate",()=>{
  const want=(history.state&&history.state.v)||"consoles";
  if(want!==view && library.length){ if(want==="games") buildGames(); else buildConsoles(); }
});

addEventListener("keydown",e=>{
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",Enter:"ok"," ":"ok",Escape:"back",Backspace:"back",PageUp:"prev",PageDown:"next"};
  const a=map[e.key]; if(!a) return;
  e.preventDefault(); input(a);
});

/* swipe */
let sx=null, sy=0, st=0, suppressClick=false;
addEventListener("pointerdown",e=>{ if(e.target.closest(".stage")){ sx=e.clientX; sy=e.clientY; st=Date.now(); } });
addEventListener("pointerup",e=>{
  if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)) return;
  const step = view==="games"?els.step:els.cw*.8;
  const n = Math.max(1,Math.round(Math.abs(dx)/step*(Date.now()-st<220?2:1)));
  for(let i=0;i<n;i++) input(dx<0?"right":"left");
  suppressClick=true; setTimeout(()=>suppressClick=false,50);
});
addEventListener("click",e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } },true);

/* Gamepad, standard mapping: bottom face button confirms, right face button goes back. */
const BTN={0:"ok",1:"back",4:"prev",5:"next",6:"prev",7:"next",12:"up",13:"down",14:"left",15:"right"};
const REPEATS=new Set(["left","right","up","down","prev","next"]);
const held={}; let prevPressed={}, ignoreUntilRelease=false;
function padReset(){ prevPressed={}; for(const k in held) delete held[k]; ignoreUntilRelease=true; }
function detectKind(id){ id=id.toLowerCase();
  if(/054c|playstation|dualshock|dualsense|wireless controller/.test(id)) return "ps";
  if(/057e|nintendo|pro controller|joy-con/.test(id)) return "nintendo";
  return "xbox"; }
function poll(){
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const now=performance.now(), pressed={};
  for(const p of pads){
    for(const [i,a] of Object.entries(BTN)) if(p.buttons[i]&&p.buttons[i].pressed) pressed[a]=true;
    const x=p.axes[0]||0, y=p.axes[1]||0;
    if(x<-.55) pressed.left=true; if(x>.55) pressed.right=true;
    if(y<-.7) pressed.up=true; if(y>.7) pressed.down=true;
  }
  const kind = pads.length?detectKind(pads[0].id):null;
  if(kind!==padKind){ padKind=kind; if(els.bottom&&els.hints) bottomBar(els.hints, els.withLibrary); }
  if(ignoreUntilRelease){ if(!Object.keys(pressed).length) ignoreUntilRelease=false; }
  else for(const a in pressed){
    if(!prevPressed[a]){ input(a); held[a]=now+380; }
    else if(REPEATS.has(a) && now>=held[a]){
      input(a);
      const t=now-(held[a]-380); held[a]=now+(a==="left"||a==="right"?(t>1600?45:t>700?75:110):220);
    }
  }
  prevPressed=pressed;
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

setInterval(()=>{ const c=$("clock"); if(c) c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }, 15000);

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(!library.length || !els.stage) return;
  if(view==="games"){ sizeGames(); updateGames(true); } else { sizeConsoles(); updateConsoles(); }
},80); });

let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3000); }

$("lpl").addEventListener("change", async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const next=[...library]; let added=0; const bad=[];
  for(const f of files){
    try{
      const data=JSON.parse(await f.text());
      const fallback=f.name.replace(/\.lpl$/i,"");
      const by={};
      (data.items||[]).forEach(it=>{
        const s=(it.db_name||"").replace(/\.lpl$/i,"")||fallback;
        (by[s] ||= []).push({label:it.label||fileOf(it.path).replace(/\.[^.]+$/,""), file:fileOf(it.path)});
      });
      for(const [s,games] of Object.entries(by)){
        games.sort((a,b)=>a.label.localeCompare(b.label));
        const i=next.findIndex(x=>x.system===s);
        if(i>=0) next[i]={system:s,games}; else next.push({system:s,games});
        added+=games.length;
      }
    }catch(err){ bad.push(f.name); }
  }
  library=next.sort((a,b)=>info(a.system).order-info(b.system).order || a.system.localeCompare(b.system));
  save(); view="consoles"; ci=Math.max(0,library.findIndex(s=>s.system===ui.sys)); history.replaceState({v:"consoles"},""); render();
  toast(bad.length?`Couldn't read ${bad.join(", ")}. Pick the .lpl files in RetroArch › playlists.`:`Loaded ${added} games`);
  e.target.value="";
});

/* ---------- updates ----------
   The service worker serves the app network-first, so a cold start always gets the newest index.html.
   iOS often resumes a home-screen app instead of reloading it, so on every return to the app we also
   fetch the page, compare its version, and reload if it changed. Library and position survive the reload. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js?v="+encodeURIComponent(APP_VERSION), {scope:"./", updateViaCache:"none"}).catch(()=>{});
}
let lastCheck=0;
async function checkForUpdate(){
  if(!/^https?:$/.test(location.protocol) || launching || Date.now()-lastCheck<20000) return;
  lastCheck=Date.now();
  try{
    const html=await (await fetch(location.pathname,{cache:"no-store"})).text();
    const m=html.match(/<meta name="app-version" content="([^"]+)"/);
    if(m && m[1]!==APP_VERSION){
      try{ sessionStorage.setItem("arcade-shelf-updated", m[1]); }catch(e){}
      if(navigator.serviceWorker && navigator.serviceWorker.controller) location.reload();
      else location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
    }
  }catch(e){ /* offline: keep running the cached version */ }
}
setInterval(()=>{ if(!document.hidden) checkForUpdate(); }, 30*60*1000);

history.replaceState({v:"consoles"},"");
render();
try{ const u=sessionStorage.getItem("arcade-shelf-updated"); if(u){ sessionStorage.removeItem("arcade-shelf-updated"); toast(`Updated to v${APP_VERSION}`); } }catch(e){}
checkForUpdate();
</script>
