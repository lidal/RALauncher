<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Shelf</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade Shelf">
<meta name="theme-color" content="#141414">
<meta name="app-version" content="2.5.1">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="icon" href="img/icon.png">
<style>
/* Controller-first launcher for RetroArch. Two screens: pick a console, pick a game. */
:root{
  --bg:#141414; --fg:#f2f2f2; --muted:#8e8e8e; --faint:#2a2a2a;
  --font:-apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --sl:max(32px,env(safe-area-inset-left,0px)); --sr:max(32px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.app{overflow:hidden;position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{-webkit-user-drag:none}

/* the focused game's screenshot, faint and unblurred, pixels kept sharp */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg div{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;opacity:0;transition:opacity .5s ease}
#bg div.on{opacity:.06}

.screen{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto 1fr auto}

.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--sr) 0 var(--sl);min-height:54px;font-size:17px}
.top h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .n{color:var(--muted);font-weight:400;margin-left:8px}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:-8px;border-radius:17px;flex:none}
.back:active{background:var(--faint)}
.back svg{width:20px;height:20px}
.spacer{flex:1}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}

.stage{position:relative;min-height:0;overflow:hidden}

/* ---------- coverflow (shared by both screens) ---------- */
.flow{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.flow.dragging{cursor:grabbing}
.cf{position:absolute;left:50%;top:var(--cft);width:var(--cfw);height:var(--cfh);margin-left:calc(var(--cfw) / -2);
  backface-visibility:hidden;will-change:transform}
.cf .cover{position:absolute;inset:0;overflow:hidden;background:#222}
.cf .cover img{width:100%;height:100%;object-fit:cover;display:block}
.cf .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.cf .fb{width:100%;height:100%;display:flex;align-items:flex-end;padding:10%;font-weight:700;line-height:1.1;color:#ddd;background:#262626;font-size:var(--fbs)}
.games .cf{-webkit-box-reflect:below 1px linear-gradient(transparent 62%,rgba(255,255,255,.22))}
/* consoles: the icon on its own, never skewed; distance only scales and dims it */
.consoles .cf .cover{background:none;overflow:visible}
.consoles .cf .cover img{object-fit:contain}
.consoles .cf .shade{display:none}
.cf .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cfh) * .14);font-weight:700;color:#3a3a3a;text-align:center}

.consoles,.games{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto}
.caption{text-align:center;padding:0 var(--sr) 18px var(--sl);min-height:84px}
.caption h2{font-size:clamp(24px,3vh + .9vw,36px);font-weight:700;letter-spacing:-.02em;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption p{margin:0;color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.letter{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:20px;background:rgba(20,20,20,.94);
  border:1px solid #333;display:grid;place-items:center;font-size:64px;font-weight:700;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:2000}
.letter.on{opacity:1;transition:none}

/* ---------- bottom bar ---------- */
.bottom{display:flex;align-items:center;gap:24px;padding:8px var(--sr) calc(14px + env(safe-area-inset-bottom,0px)) var(--sl);
  color:var(--muted);font-size:15px;min-height:50px}
.bottom .h{display:flex;align-items:center;gap:8px;white-space:nowrap}
.g{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;line-height:1}
.g.sq{border-radius:6px}
.g svg{width:14px;height:14px}
.g.face{background:none;color:var(--fg);padding:0;min-width:24px}
.g.face svg{width:24px;height:24px}
.g.wide svg{width:22px;height:13px}
.textbtn{color:var(--muted);font-size:15px;padding:6px 0}
.textbtn:active{color:var(--fg)}
.ver{color:#555;font-size:13px}

.launch{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s ease;text-align:center}
.launch.on{opacity:1;pointer-events:auto}
.launch p{margin:0 0 6px;color:var(--muted);font-size:17px}
.launch h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;padding:0 32px}

/* ---------- first run ---------- */
.empty{position:fixed;inset:0;z-index:1;overflow:auto;-webkit-user-select:text;user-select:text;
  padding:calc(48px + env(safe-area-inset-top,0px)) var(--sr) 48px var(--sl);display:flex;align-items:center;justify-content:center;gap:6vw}
.empty>div{flex:1 1 0;max-width:460px}
.empty img{flex:1 1 0;min-width:0;max-width:440px;height:auto}
.empty h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.empty p{color:var(--muted);line-height:1.5;margin:0 0 16px;font-size:17px}
.empty ol{color:var(--muted);line-height:1.8;padding-left:22px;margin:0 0 28px;font-size:17px}
.empty b{color:var(--fg);font-weight:600}
.primary{background:var(--fg);color:var(--bg);font-weight:600;font-size:17px;padding:13px 22px;border-radius:12px;display:inline-block;cursor:pointer}
@media (max-aspect-ratio:1/1){.empty img{display:none}}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#2a2a2a;
  padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100vw - 48px);z-index:20}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bg"><div id="snapA"></div><div id="snapB"></div></div>
<div id="root"></div>
<input id="lpl" type="file" multiple hidden>
<div class="launch" id="launch"><div><p>Starting</p><h2 id="launchTitle"></h2></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Bump on every change (tools/bump-version.sh does it). Open apps notice and reload themselves. */
const APP_VERSION = "2.5.1";
const KEY = "arcade-shelf-library-v2", UIKEY = "arcade-shelf-ui-v1";

/* libretro playlist name -> display name, console photo, box art shape (width / height) */
const SYSTEMS = [
  ["Nintendo - Nintendo Entertainment System","NES","nes",.72],
  ["Nintendo - Family Computer Disk System","Famicom Disk System","fds",.72],
  ["Nintendo - Super Nintendo Entertainment System","Super Nintendo","snes",1.38],
  ["Nintendo - Nintendo 64","Nintendo 64","n64",1.38],
  ["Nintendo - GameCube","GameCube","gc",.71],
  ["Nintendo - Game Boy","Game Boy","gb",.98],
  ["Nintendo - Game Boy Color","Game Boy Color","gbc",.98],
  ["Nintendo - Game Boy Advance","Game Boy Advance","gba",.98],
  ["Nintendo - Nintendo DS","Nintendo DS","nds",.9],
  ["Nintendo - Virtual Boy","Virtual Boy","vb",.72],
  ["Sega - Master System - Mark III","Master System","sms",.72],
  ["Sega - Mega Drive - Genesis","Mega Drive","md",.7],
  ["Sega - Dreamcast","Dreamcast","dc",.9],
  ["NEC - PC Engine - TurboGrafx 16","PC Engine","pce",.9],
  ["Sony - PlayStation","PlayStation","ps1",1],
  ["FBNeo - Arcade Games","Arcade","arcade",.75],
  ["MAME","Arcade","arcade",.75]
];
/* flat system icons in img/systems: RetroArch "Retrosystem" theme, CC BY 4.0 (see img/systems/CREDITS.md) */
const ICONS = new Set(["nes","fds","snes","n64","gc","gb","gbc","gba","nds","vb","sms","md","dc","pce","ps1","arcade"]);
const SYS = Object.fromEntries(SYSTEMS.map((s,i)=>[s[0],{short:s[1],img:s[2],ar:s[3],order:i}]));
function info(name){ return SYS[name] || {short:name.replace(/^.*? - /,""),img:null,ar:.75,order:999}; }
function photo(key){ return key && ICONS.has(key) ? `img/systems/${key}.svg` : null; }

/* ---------- data ---------- */
let library = load();
let ui = loadUI();
let view = "consoles";
let ci = Math.max(0, library.findIndex(s=>s.system===ui.sys));
let gi = 0;

function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):[] }catch(e){ return [] } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(library.map(({system,games,fmt})=>({system,games,fmt})))) }catch(e){} }
function loadUI(){ try{ return JSON.parse(localStorage.getItem(UIKEY))||{pos:{}} }catch(e){ return {pos:{}} } }
let uiT; function saveUISoon(){ clearTimeout(uiT); uiT=setTimeout(saveUI,400); }
function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify(ui)) }catch(e){} }

function thumbURL(system,label,kind="Named_Boxarts"){
  const clean = label.replace(/[&*\/:`<>?\\|"]/g,"_");
  return "https://thumbnails.libretro.com/"+encodeURIComponent(system)+"/"+kind+"/"+encodeURIComponent(clean)+".png";
}
function fileOf(path){ return (path||"").split("#")[0].split(/[\\/]/).pop(); }
/* The name RetroArch's retroarch://game/<name> link looks up: its path_basename(). For a game inside an
   archive ("Game.zip#Game.z64") that is the file inside, i.e. everything after the first '#' that directly
   follows .zip/.7z/.zst/.apk/.rar; otherwise the part after the last slash. */
function launchName(path){
  path=path||"";
  const m=path.match(/\.(?:zip|7z|zst|apk|rar)#/i);
  return m ? path.slice(m.index+m[0].length) : path.split(/[\\/]/).pop();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function splitTitle(label){ const m=label.match(/^(.*?)\s*([(\[].*)$/); return m?[m[1], m[2].split(/[()\[\]]/).map(s=>s.trim()).filter(Boolean)]:[label,[]]; }
function letterOf(label){ const c=label.replace(/^(the|a)\s+/i,"").trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:"#"; }
const failed = new Set();
/* box art cache, filled by the service worker (sw.js). A cached response that turns out not to be an
   image (the server's 404s look the same as hits to the worker) is removed so it can't stick. */
const ART_CACHE = "arcade-art-v1";
function forgetArt(url){ if(window.caches) caches.open(ART_CACHE).then(c=>c.delete(url)).catch(()=>{}); }
addEventListener("online",()=>failed.clear());
const sys = ()=>library[ci];
const $ = id=>document.getElementById(id);

/* ---------- controller glyphs ---------- */
let padKind = null; // set while a controller is connected; hints only show then
/* Controller-agnostic glyphs: face buttons are drawn by position (the filled dot in the diamond),
   so they read the same on Xbox, PlayStation, Switch and MFi pads. */
function glyph(btn){
  const face=pos=>{ const at={south:[12,19],east:[19,12],west:[5,12],north:[12,5]};
    return `<span class="g face"><svg viewBox="0 0 24 24">${Object.entries(at).map(([k,[x,y]])=>
      k===pos?`<circle cx="${x}" cy="${y}" r="4.2" fill="currentColor"/>`:`<circle cx="${x}" cy="${y}" r="3.4" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>`).join("")}</svg></span>`; };
  if(btn==="ok") return face("south");
  if(btn==="back") return face("east");
  if(btn==="save") return face("west");
  if(btn==="leftright") return `<span class="g wide"><svg viewBox="0 0 28 16"><path d="M9 3 4 8l5 5M19 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  if(btn==="LR") return `<span class="g sq">L</span><span class="g sq">R</span>`;
  return "";
}

/* ---------- rendering ---------- */
let els = {};

function render(){
  document.body.classList.toggle("app", !!library.length);
  if(!library.length) return renderEmpty();
  if(ci>=library.length) ci=0;
  $("root").innerHTML = `
  <div class="screen">
    <header class="top" id="top"></header>
    <main class="stage" id="stage"></main>
    <footer class="bottom" id="bottom"></footer>
  </div>`;
  els = {top:$("top"), stage:$("stage"), bottom:$("bottom")};
  view==="games" ? buildGames() : buildConsoles();
}

function renderEmpty(){
  $("root").innerHTML = `<div class="empty">
    <div>
      <h1>Arcade Shelf</h1>
      <p>A launcher for the games you've already added to RetroArch. It reads RetroArch's playlists, so there's nothing else to set up.</p>
      <ol>
        <li>Tap <b>Choose playlists</b>.</li>
        <li>Go to <b>On My iPad › RetroArch › playlists</b>.</li>
        <li>Select every <b>.lpl</b> file and tap Open.</li>
      </ol>
      <label class="primary" for="lpl">Choose playlists</label>
    </div>
    <img src="img/systems/snes.svg" alt="">
  </div>`;
}

function clockHTML(){ return `<span class="clock" id="clock">${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>`; }

function bottomBar(hints, withLibrary){
  els.hints=hints; els.withLibrary=withLibrary;
  els.bottom.innerHTML = (withLibrary?`<button class="textbtn" id="reload">Update library</button>${padKind&&!offlineJob?"":`<button class="textbtn" id="offline">${offlineLabel()}</button>`}<span class="ver">v${APP_VERSION}</span>`:"")
    + `<div class="spacer"></div>` + (padKind ? hints.map(([g,t])=>`<span class="h">${glyph(g)}${t}</span>`).join("") : "");
  const r=$("reload"); if(r) r.onclick=()=>$("lpl").click();
  const o=$("offline"); if(o) o.onclick=saveOffline;
}

/* ---------- coverflow ----------
   One engine for both screens. `pos` is a continuous index that eases toward `target` every frame.
   Controller and keys move the target; a finger drags `pos` directly and a flick carries on with momentum,
   then settles on the nearest item. Only items near the focus exist in the DOM. */
class Flow{
  constructor(host,o){
    Object.assign(this,{host,count:o.count,make:o.make,onFocus:o.onFocus,onTap:o.onTap,angle:o.angle??62,
      gapF:o.gap||.78,spacingF:o.spacing||.24,depthF:o.depth||.55,flatScale:o.shrink??.4,fade:!!o.fade,
      pos:o.start||0,target:o.start||0,vel:0,speed:0,items:new Map(),focus:-1,raf:0,last:0,drag:null});
    host.classList.add("flow");
    this.tick=this.tick.bind(this);
    host.addEventListener("pointerdown",this); host.addEventListener("pointermove",this);
    host.addEventListener("pointerup",this); host.addEventListener("pointercancel",this);
    host.addEventListener("wheel",this,{passive:false});
  }
  /* w,h: item size. top: item's top edge inside the host. */
  layout({w,h,top}){
    const H=this.host;
    Object.assign(this,{w,h,gap:w*this.gapF,spacing:w*this.spacingF,depth:w*this.depthF,unit:w*.36});
    H.style.setProperty("--cfw",w+"px"); H.style.setProperty("--cfh",h+"px"); H.style.setProperty("--cft",top+"px");
    H.style.perspective=this.angle?(w*3.4)+"px":"none";
    this.radius=Math.ceil((H.clientWidth/2-this.gap)/this.spacing)+2;
    this.items.forEach(el=>el.remove()); this.items.clear();
    this.render();
  }
  clamp(i){ return Math.max(0,Math.min(this.count-1,i)); }
  setTarget(i,instant){ this.target=this.clamp(Math.round(i)); if(instant){ this.pos=this.target; this.render(); } else this.run(); }
  go(d){ this.setTarget(Math.round(this.target)+d); }
  run(){ if(!this.raf){ this.last=performance.now(); this.raf=requestAnimationFrame(this.tick); } }
  tick(now){
    const dt=Math.min(.05,(now-this.last)/1000); this.last=now;
    if(!this.drag){
      /* critically damped spring that keeps its velocity (so a flick hands its speed over smoothly),
         with a speed cap so long jumps glide instead of teleporting */
      const W=10, VMAX=26, steps=Math.max(1,Math.ceil(dt*240)), h=dt/steps;
      for(let i=0;i<steps;i++){
        this.vel+=(W*W*(this.target-this.pos)-2*W*this.vel)*h;
        this.vel=Math.max(-VMAX,Math.min(VMAX,this.vel));
        this.pos+=this.vel*h;
      }
      this.speed=Math.abs(this.vel);
      if(Math.abs(this.target-this.pos)<.002 && this.speed<.02){ this.pos=this.target; this.vel=0; this.speed=0; this.render(); this.raf=0; return; }
    } else this.speed=Math.abs(this.pos-(this.lastPos??this.pos))/Math.max(dt,.001);
    this.lastPos=this.pos;
    this.render();
    this.raf=requestAnimationFrame(this.tick);
  }
  render(){
    if(!this.w) return;
    const n=this.count, c=Math.round(this.pos), R=this.radius;
    for(const [k,el] of this.items) if(Math.abs(k-c)>R){ el.remove(); this.items.delete(k); }
    for(let k=Math.max(0,c-R);k<=Math.min(n-1,c+R);k++) if(!this.items.has(k)){
      const el=this.make(k); el.classList.add("cf"); el.dataset.i=k; el._lazy=el.querySelector("img[data-src]");
      if(!el.querySelector(".shade")) el.insertAdjacentHTML("beforeend",'<div class="shade"></div>');
      this.items.set(k,el); this.host.appendChild(el);
    }
    for(const [k,el] of this.items){
      const d=k-this.pos, a=Math.abs(d), t=Math.max(-1,Math.min(1,d));
      const x = a<=1 ? d*this.gap : Math.sign(d)*(this.gap+(a-1)*this.spacing);
      el.style.transform = this.angle
        ? `translate3d(${x.toFixed(1)}px,0,${(-Math.min(a,1)*this.depth).toFixed(1)}px) rotateY(${(-t*this.angle).toFixed(2)}deg)`
        : `translateX(${x.toFixed(1)}px) scale(${(1-Math.min(a,1)*this.flatScale).toFixed(4)})`;   // flat: plain 2D, no perspective
      el.style.zIndex=1000-Math.round(a*10);
      const edge = a>R-1.5 ? Math.max(0,R-.5-a) : 1;
      const dim=Math.min(a,1)*.55+Math.max(0,a-1)*.05;
      el.style.opacity=edge;
      if(this.fade) el.style.filter=`brightness(${(1-dim).toFixed(3)})`;   // transparent icons: darken, never see-through
      else el.lastChild.style.opacity=dim.toFixed(3);                       // covers: shade overlay
      /* big box art decodes slowly: only start it once scrolling slows, or right next to the centre */
      if(el._lazy && (this.speed<8 || a<1.6)){ el._lazy.src=el._lazy.dataset.src; el._lazy=null; }
    }
    const f=this.clamp(Math.round(this.pos));
    if(f!==this.focus){ this.focus=f; this.onFocus&&this.onFocus(f); }
  }
  handleEvent(e){
    const dr=this.drag;
    if(e.type==="pointerdown"){
      if(e.button>0) return;
      this.host.setPointerCapture(e.pointerId);
      const item=e.target.closest&&e.target.closest(".cf");
      this.drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,p0:this.pos,moved:false,item:item?+item.dataset.i:null,s:[[e.timeStamp,this.pos]]};
      this.target=this.pos; this.vel=0; this.run();
    } else if(e.type==="pointermove" && dr && e.pointerId===dr.id){
      const dx=e.clientX-dr.x0;
      if(!dr.moved && Math.abs(dx)>6){ dr.moved=true; this.host.classList.add("dragging"); }
      if(!dr.moved) return;
      const raw=dr.p0-dx/this.unit, max=this.count-1;
      this.pos = raw<0 ? raw*.3 : raw>max ? max+(raw-max)*.3 : raw;   // rubber band past the ends
      dr.s.push([e.timeStamp,this.pos]); if(dr.s.length>8) dr.s.shift();
    } else if((e.type==="pointerup"||e.type==="pointercancel") && dr && e.pointerId===dr.id){
      this.drag=null; this.host.classList.remove("dragging");
      if(!dr.moved){
        if(e.type==="pointerup" && dr.item!==null){ if(dr.item===this.focus && Math.abs(this.pos-this.focus)<.2) this.onTap&&this.onTap(dr.item); else this.setTarget(dr.item); }
        else this.setTarget(this.pos);
        return;
      }
      const now=e.timeStamp, s=dr.s.filter(p=>now-p[0]<120), a=s[0]||[now,this.pos];
      const v = now-a[0]>8 ? (this.pos-a[1])/((now-a[0])/1000) : 0;       // items per second
      this.vel=Math.max(-26,Math.min(26,v)); this.target=this.clamp(Math.round(this.pos+this.vel*.2)); this.run();
    } else if(e.type==="wheel"){
      e.preventDefault();
      const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
      this.target=this.clamp(this.target+d/(this.unit*1.4)); this.run();
      clearTimeout(this.wt); this.wt=setTimeout(()=>this.setTarget(this.target),110);
    }
  }
}

/* --- consoles --- */
function buildConsoles(){
  view="consoles"; setSnap(null);
  els.top.innerHTML = `<h1>Consoles</h1><div class="spacer"></div>${clockHTML()}`;
  els.stage.innerHTML = `<section class="consoles"><div id="flow"></div><div class="caption" id="caption"></div></section>`;
  els.caption=$("caption");
  els.flow=new Flow($("flow"),{count:library.length,start:ci,angle:0,gap:1.06,spacing:.66,shrink:.4,fade:true,
    make:i=>{ const el=document.createElement("div"), s=library[i], p=photo(info(s.system).img);
      el.innerHTML=`<div class="cover">${p?`<img src="${p}" alt="" draggable="false">`:`<div class="noimg">${esc(info(s.system).short)}</div>`}</div>`; return el; },
    onFocus:i=>{ ci=i; const s=sys();
      els.caption.innerHTML=`<h2>${esc(info(s.system).short)}</h2><p>${s.games.length} ${s.games.length===1?"game":"games"}</p>`;
      ui.sys=s.system; saveUISoon(); },
    onTap:()=>input("ok")});
  bottomBar([["leftright","Browse consoles"],["ok","Open"],["save","Save artwork offline"]], true);
  sizeConsoles();
}
function sizeConsoles(){
  const f=els.flow, H=f.host.clientHeight, W=f.host.clientWidth;
  const s=Math.round(Math.min(H*.8, W*.3));
  f.layout({w:s,h:s,top:Math.round((H-s)/2)});
}

/* --- games --- */
function buildGames(){
  view="games";
  const s=sys(), i=info(s.system);
  gi = Math.min(ui.pos[s.system]||0, s.games.length-1);
  s.keys = s.games.map(g=>letterOf(g.label));
  els.top.innerHTML = `<button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1>${esc(i.short)}<span class="n">${s.games.length}</span></h1><div class="spacer"></div>${clockHTML()}`;
  $("back").onclick=()=>input("back");
  els.stage.innerHTML = `<section class="games"><div id="flow"><div class="letter" id="letter"></div></div>
      <div class="caption"><h2 id="title"></h2><p id="details"></p></div></section>`;
  Object.assign(els,{letter:$("letter"),title:$("title"),details:$("details")});
  els.flow=new Flow($("flow"),{count:s.games.length,start:gi,make:coverEl,onFocus:focusGame,onTap:()=>input("ok")});
  bottomBar([["leftright","Browse games"],["LR","Jump to letter"],["ok","Play"],["back","Back"]], false);
  sizeGames();
}
function sizeGames(){
  const f=els.flow, H=f.host.clientHeight, W=f.host.clientWidth, ar=info(sys().system).ar;
  let h=Math.min(H*.66, 420), w=h*ar;
  if(w>W*.34){ w=W*.34; h=w/ar; }
  w=Math.round(w); h=Math.round(h);
  els.fbs=Math.max(13,Math.round(h*.07));
  f.layout({w,h,top:Math.round((H-h*1.22)/2)});   // leave room for the reflection
}
function coverEl(k){
  const s=sys(), g=s.games[k], [name]=splitTitle(g.label);
  const el=document.createElement("div");
  el.innerHTML=`<div class="cover"></div>`;
  const cover=el.firstChild, url=thumbURL(s.system,g.label);
  const fb=()=>{ cover.innerHTML=`<div class="fb" style="--fbs:${els.fbs}px">${esc(name)}</div>`; };
  if(failed.has(url)) fb(); else {
    const img=new Image(); img.alt=""; img.decoding="async"; img.draggable=false;
    img.onerror=()=>{ failed.add(url); forgetArt(url); fb(); };
    img.dataset.src=url; cover.appendChild(img);
  }
  return el;
}
let snapTimer, letterTimer;
function focusGame(k){
  gi=k;
  const s=sys(), g=s.games[gi], [name,tags]=splitTitle(g.label);
  els.title.textContent=name;
  els.details.textContent=[tags.join(", "), `${gi+1} of ${s.games.length}`].filter(Boolean).join("  ·  ");
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>setSnap(thumbURL(s.system,g.label,"Named_Snaps")), 250);
  ui.pos[s.system]=gi; saveUISoon();
}
let snapFlip=false, snapWant=null;
function setSnap(url){
  snapWant=url;
  const a=$("snapA"), b=$("snapB");
  if(!url || failed.has(url)){ a.classList.remove("on"); b.classList.remove("on"); return; }
  const img=new Image();
  img.onload=()=>{ if(snapWant!==url) return; snapFlip=!snapFlip; const show=snapFlip?a:b, hide=snapFlip?b:a;
    show.style.backgroundImage=`url("${url}")`; show.classList.add("on"); hide.classList.remove("on"); };
  img.onerror=()=>{ failed.add(url); forgetArt(url); if(snapWant===url){ a.classList.remove("on"); b.classList.remove("on"); } };
  img.src=url;
}
function showLetter(j){
  els.letter.textContent=sys().keys[j]; els.letter.classList.add("on");
  clearTimeout(letterTimer); letterTimer=setTimeout(()=>els.letter.classList.remove("on"),450);
}

/* ---------- input ---------- */
let launching=false;
function input(a){
  if(launching || !library.length || !els.flow) return;
  const f=els.flow;
  if(a==="left") f.go(-1);
  else if(a==="right") f.go(1);
  else if(view==="consoles"){ if(a==="save") saveOffline(); else if(a==="ok"){ ci=f.focus; history.pushState({v:"games"},""); buildGames(); } }
  else {
    const s=sys(), n=s.games.length, keys=s.keys, cur=Math.round(f.target);
    if(a==="next"||a==="down"){ const k=keys[cur]; let j=cur; while(j<n&&keys[j]===k) j++; if(j<n){ f.setTarget(j); showLetter(j); } }
    else if(a==="prev"||a==="up"){ let j=cur; const k=keys[cur]; if(j>0&&keys[j-1]===k){ while(j>0&&keys[j-1]===k) j--; } else if(j>0){ j--; const k2=keys[j]; while(j>0&&keys[j-1]===k2) j--; } if(j!==cur){ f.setTarget(j); showLetter(j); } }
    else if(a==="ok"){ gi=f.focus; launch(); }
    else if(a==="back") history.back();
  }
}
function launch(){
  const g=sys().games[gi], [name]=splitTitle(g.label);
  launching=true; saveUI();
  $("launchTitle").textContent=name; $("launch").classList.add("on");
  setTimeout(()=>{ location.href="retroarch://game/"+encodeURIComponent(g.file); }, 250);
  setTimeout(endLaunch, 2500);
}
function endLaunch(){ if(!launching) return; launching=false; $("launch").classList.remove("on"); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveUI(); if(!document.hidden){ endLaunch(); padReset(); checkForUpdate(); } });

window.addEventListener("popstate",()=>{
  const want=(history.state&&history.state.v)||"consoles";
  if(want!==view && library.length){ if(want==="games") buildGames(); else buildConsoles(); }
});

addEventListener("keydown",e=>{
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",Enter:"ok"," ":"ok",Escape:"back",Backspace:"back",PageUp:"prev",PageDown:"next"};
  const a=map[e.key]; if(!a) return;
  e.preventDefault(); input(a);
});

/* Gamepad, standard mapping: bottom face button confirms, right face button goes back. */
const BTN={0:"ok",1:"back",2:"save",4:"prev",5:"next",6:"prev",7:"next",12:"up",13:"down",14:"left",15:"right"};
const REPEATS=new Set(["left","right","up","down","prev","next"]);
const held={}; let prevPressed={}, ignoreUntilRelease=false;
function padReset(){ prevPressed={}; for(const k in held) delete held[k]; ignoreUntilRelease=true; }
function detectKind(id){ id=id.toLowerCase();
  if(/054c|playstation|dualshock|dualsense|wireless controller/.test(id)) return "ps";
  if(/057e|nintendo|pro controller|joy-con/.test(id)) return "nintendo";
  return "xbox"; }
function poll(){
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const now=performance.now(), pressed={};
  for(const p of pads){
    for(const [i,a] of Object.entries(BTN)) if(p.buttons[i]&&p.buttons[i].pressed) pressed[a]=true;
    const x=p.axes[0]||0, y=p.axes[1]||0;
    if(x<-.55) pressed.left=true; if(x>.55) pressed.right=true;
    if(y<-.7) pressed.up=true; if(y>.7) pressed.down=true;
  }
  const kind = pads.length?detectKind(pads[0].id):null;
  if(kind!==padKind){ padKind=kind; if(els.bottom&&els.hints) bottomBar(els.hints, els.withLibrary); }
  if(ignoreUntilRelease){ if(!Object.keys(pressed).length) ignoreUntilRelease=false; }
  else for(const a in pressed){
    if(!prevPressed[a]){ input(a); held[a]=now+380; }
    else if(REPEATS.has(a) && now>=held[a]){
      input(a);
      const t=now-(held[a]-380); held[a]=now+(a==="left"||a==="right"?(t>1600?45:t>700?75:110):220);
    }
  }
  prevPressed=pressed;
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

setInterval(()=>{ const c=$("clock"); if(c) c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }, 15000);

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(!library.length || !els.stage) return;
  if(view==="games") sizeGames(); else sizeConsoles();
},80); });

let tt; function toast(msg,ms=3000){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,ms); }

$("lpl").addEventListener("change", async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const next=[...library]; let added=0; const bad=[];
  for(const f of files){
    try{
      const data=JSON.parse(await f.text());
      const fallback=f.name.replace(/\.lpl$/i,"");
      const by={};
      (data.items||[]).forEach(it=>{
        const s=(it.db_name||"").replace(/\.lpl$/i,"")||fallback;
        (by[s] ||= []).push({label:it.label||fileOf(it.path).replace(/\.[^.]+$/,""), file:launchName(it.path)});
      });
      for(const [s,games] of Object.entries(by)){
        games.sort((a,b)=>a.label.localeCompare(b.label));
        const i=next.findIndex(x=>x.system===s);
        if(i>=0) next[i]={system:s,games,fmt:2}; else next.push({system:s,games,fmt:2});
        added+=games.length;
      }
    }catch(err){ bad.push(f.name); }
  }
  library=next.sort((a,b)=>info(a.system).order-info(b.system).order || a.system.localeCompare(b.system));
  save(); view="consoles"; ci=Math.max(0,library.findIndex(s=>s.system===ui.sys)); history.replaceState({v:"consoles"},""); render();
  toast(bad.length?`Couldn't read ${bad.join(", ")}. Pick the .lpl files in RetroArch › playlists.`:`Loaded ${added} games`);
  e.target.value="";
});

/* ---------- offline artwork ----------
   Loads every game's box art and screenshot once, through the service worker, which keeps them.
   Loading as images (not fetch) is what tells real art apart from the server's missing-file replies. */
let offlineJob=null;
function offlineLabel(){
  if(!offlineJob) return "Save artwork offline";
  return offlineJob.done ? `Artwork saved (${offlineJob.ok} images)` : `Saving artwork ${offlineJob.n} / ${offlineJob.total}`;
}
function refreshOfflineLabel(){ const o=$("offline"); if(o) o.textContent=offlineLabel(); }
async function saveOffline(){
  if(offlineJob && !offlineJob.done) return;
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller){ toast("Offline saving needs the installed app over the internet. Reopen it and try again."); return; }
  if(!navigator.onLine){ toast("You're offline. Connect to the internet to save artwork."); return; }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  const cache=await caches.open(ART_CACHE), urls=[];
  for(const s of library) for(const g of s.games){ urls.push(thumbURL(s.system,g.label)); urls.push(thumbURL(s.system,g.label,"Named_Snaps")); }
  const todo=[];
  for(const u of urls) if(!failed.has(u) && !(await cache.match(u))) todo.push(u);
  const job=offlineJob={n:urls.length-todo.length,total:urls.length,ok:urls.length-todo.length,done:false};
  refreshOfflineLabel();
  const one=u=>new Promise(res=>{ const im=new Image();
    im.onload=()=>{ job.ok++; res(); };
    im.onerror=()=>{ failed.add(u); cache.delete(u).catch(()=>{}); res(); };
    im.src=u; });
  let i=0;
  const worker=async()=>{ while(i<todo.length && offlineJob===job){ await one(todo[i++]); job.n++; if(job.n%5===0||job.n===job.total) refreshOfflineLabel(); } };
  await Promise.all([1,2,3,4,5,6].map(worker));
  job.done=true; refreshOfflineLabel();
  toast(`Artwork saved for offline use: ${job.ok} of ${job.total} images. The rest aren't on libretro's server.`, 6000);
}

/* ---------- updates ----------
   The service worker serves the app network-first, so a cold start always gets the newest index.html.
   iOS often resumes a home-screen app instead of reloading it, so on every return to the app we also
   fetch the page, compare its version, and reload if it changed. Library and position survive the reload. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js?v="+encodeURIComponent(APP_VERSION), {scope:"./", updateViaCache:"none"}).catch(()=>{});
}
let lastCheck=0;
async function checkForUpdate(){
  if(!/^https?:$/.test(location.protocol) || launching || Date.now()-lastCheck<20000) return;
  lastCheck=Date.now();
  try{
    const html=await (await fetch(location.pathname,{cache:"no-store"})).text();
    const m=html.match(/<meta name="app-version" content="([^"]+)"/);
    if(m && m[1]!==APP_VERSION){
      try{ sessionStorage.setItem("arcade-shelf-updated", m[1]); }catch(e){}
      if(navigator.serviceWorker && navigator.serviceWorker.controller) location.reload();
      else location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
    }
  }catch(e){ /* offline: keep running the cached version */ }
}
setInterval(()=>{ if(!document.hidden) checkForUpdate(); }, 30*60*1000);

history.replaceState({v:"consoles"},"");
render();
/* libraries imported before v2.3 stored the zip name, which RetroArch can't match for zipped games */
if(library.some(s=>!s.fmt)) setTimeout(()=>toast("Tap Update library once and pick your playlists again, so games inside zip files launch.", 9000), 600);
try{ const u=sessionStorage.getItem("arcade-shelf-updated"); if(u){ sessionStorage.removeItem("arcade-shelf-updated"); toast(`Updated to v${APP_VERSION}`); } }catch(e){}
checkForUpdate();
</script>
</body>
