<style>
/* Built for a controller in landscape: one console in focus, then a rail of that console's cartridges. */
:root{
  --bg:#101114; --surface:#1a1b20; --raised:#24262d; --line:rgba(255,255,255,.09);
  --fg:#f3f2ee; --muted:#9c9ea7; --accent:#f2b84b; --glow:#6c63d6;
  --display:"Archivo", "Helvetica Neue", system-ui, sans-serif;
  --body:"Inter", -apple-system, system-ui, sans-serif;
  --sl:max(28px,env(safe-area-inset-left,0px)); --sr:max(28px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.app{overflow:hidden;position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}

/* ambient background: console colour glow + blurred screenshot of the focused game */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .glow{position:absolute;inset:-20%;background:radial-gradient(ellipse 55% 50% at 50% 46%,color-mix(in srgb,var(--glow) 34%,transparent),transparent 70%);
  transition:background 0.6s ease}
#bg .snap{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.3);opacity:0;transition:opacity .7s ease}
#bg .snap.on{opacity:.32}
#bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 40%,rgba(8,8,10,.85) 100%),
  linear-gradient(180deg,rgba(8,8,10,.6),transparent 18%,transparent 70%,rgba(8,8,10,.8))}

.screen{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto 1fr auto}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sr) 0 var(--sl);min-height:52px}
.brand{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{width:16px;height:18px;display:block;background:var(--accent);
  clip-path:polygon(18% 0,82% 0,100% 16%,100% 100%,0 100%,0 16%);border-radius:2px}
.crumb{color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.crumb svg{width:16px;height:16px;opacity:.7}
.back{display:none;align-items:center;gap:2px;color:var(--fg);font-weight:600;font-size:15px;padding:8px 12px 8px 4px;margin-left:-4px;border-radius:10px;background:rgba(255,255,255,.06)}
.back svg{width:18px;height:18px}
.games-on .back{display:flex}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.pad{display:none;width:22px;height:22px;color:var(--fg);opacity:.75}
.has-pad .pad{display:block}
.link{color:var(--muted);font-size:14px;font-weight:500;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06)}
.link:active{color:var(--fg)}
.games-on .link{display:none}

.stage{position:relative;min-height:0;overflow:hidden;touch-action:pan-y}

/* ---------- console view ---------- */
.consoles{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto}
.carousel{position:relative;min-height:0}
.cons{position:absolute;left:50%;top:52%;width:var(--cw);height:calc(var(--cw) * .75);margin:calc(var(--cw) * -.375) 0 0 calc(var(--cw) * -.5);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s ease,filter .45s ease;will-change:transform}
.cons svg{width:100%;height:100%;display:block;overflow:visible}
.cons .floor{position:absolute;left:12%;right:12%;bottom:2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);z-index:-1}
.cons.on{filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
.cons:not(.on){filter:saturate(.55) brightness(.6)}
.caption{text-align:center;padding:0 var(--sr) 6px var(--sl)}
.caption .maker{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.caption h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(28px,4vh + 1.6vw,60px);line-height:1.02;letter-spacing:-.015em;margin:6px 0 8px}
.caption .sub{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.caption .sub b{color:var(--fg);font-weight:600}
.dots{display:flex;justify-content:center;gap:7px;margin-top:14px}
.dots span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);transition:width .3s ease,background .3s ease}
.dots span.on{width:22px;background:var(--fg)}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- games view ---------- */
.games{position:absolute;inset:0;display:grid;grid-template-rows:1fr var(--rail)}
.hero{min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(20px,4.5vw,64px);padding:clamp(10px,3vh,32px) var(--sr) clamp(4px,1vh,12px) var(--sl)}
.box{height:100%;max-height:100%;flex:none;display:flex;align-items:center;justify-content:flex-end;width:var(--boxw);position:relative}
.box img{max-height:100%;max-width:100%;border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  transition:opacity .25s ease}
.box img.loading{opacity:0}
.box .nobox{height:100%;aspect-ratio:3/4;border-radius:6px;background:var(--fbc,#333);display:flex;align-items:flex-end;padding:8%;
  font-family:var(--display);font-stretch:105%;font-weight:800;font-size:clamp(16px,2.6vh + .6vw,30px);line-height:1.05;text-wrap:balance;
  box-shadow:0 22px 50px rgba(0,0,0,.55)}
.meta{min-width:0;flex:0 1 560px}
.meta .eyebrow{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.meta .eyebrow .n{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.meta h2{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:clamp(24px,3.6vh + 1.5vw,56px);line-height:1.02;letter-spacing:-.015em;
  margin:10px 0 14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#d9d9dd}
.play{margin-top:clamp(12px,3vh,26px);display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:#111;font-weight:600;font-size:15px;
  padding:10px 18px 10px 12px;border-radius:999px}
.play .g{background:#111;color:var(--fg)}
.play svg.tri{width:14px;height:14px;margin-left:6px}

.rail{position:relative;overflow:hidden;touch-action:pan-y}
.rail::before{content:"";position:absolute;left:0;right:0;bottom:calc(var(--rail) * .14 - 1px);height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 20%,rgba(255,255,255,.14) 80%,transparent)}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--rail) * .14);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.track{position:absolute;left:0;bottom:calc(var(--rail) * .14);height:0;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.jump{transition:none}

.cart{position:absolute;bottom:0;transform-origin:50% 100%;transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .32s ease;filter:brightness(.5) saturate(.6)}
.cart>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cart.on{transform:translateY(-9%) scale(1.14);filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
.label{position:absolute;overflow:hidden;background:#2a2b31}
.label img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.label::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 38%,transparent 70%,rgba(0,0,0,.18))}
.label .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;background:var(--fbc);
  font-family:var(--display);font-stretch:100%;font-weight:800;line-height:1.05;text-wrap:balance;color:#fff;font-size:var(--fbs,12px)}
.label .band{position:absolute;left:0;right:0;top:0;height:13%;background:linear-gradient(#f4f3ef,#dedcd6);z-index:1;display:flex;align-items:center;gap:3%;padding:0 4%}
.label .band svg{height:76%;width:auto;display:block}
.label .band b{flex:1;height:22%;background:#9c9b96;border-radius:2px;max-width:46%}
.label .band.dark{background:linear-gradient(#2c2d33,#1d1e22)}
.label .band.dark b{background:#6d6e76}
.label.withband img,.label.withband .fb{top:13%;height:87%;position:absolute}

.cart.disc .label{border-radius:50%;inset:0;
  -webkit-mask:radial-gradient(circle,transparent 9%,#000 9.6%);mask:radial-gradient(circle,transparent 9%,#000 9.6%)}
.cart.disc .label img{object-position:50% 30%}
.cart.disc .label::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(220,225,235,.85) 9.6%,rgba(160,170,185,.9) 17%,transparent 17.6%,transparent 96%,rgba(210,215,225,.9) 96.5%)}
.cart.disc .label::after{border-radius:50%;background:conic-gradient(from 200deg,rgba(255,255,255,.18),transparent 15%,rgba(140,220,255,.12) 30%,transparent 45%,rgba(255,200,240,.12) 62%,transparent 78%,rgba(255,255,255,.18))}

.letter{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-stretch:125%;font-weight:800;
  font-size:clamp(80px,22vh,200px);line-height:1;color:var(--fg);background:rgba(16,17,20,.72);border-radius:28px;padding:.12em .3em;
  pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:4;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.letter.on{opacity:1;transition:none}

/* bottom controller hints */
.hints{display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:8px var(--sr) calc(12px + env(safe-area-inset-bottom,0px)) var(--sl);
  color:var(--muted);font-size:13.5px;font-weight:500;min-height:44px}
.hints:empty{min-height:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.hints .h{display:flex;align-items:center;gap:8px;white-space:nowrap}
.g{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:rgba(255,255,255,.14);color:var(--fg);
  font-size:12px;font-weight:700;font-family:var(--body);line-height:1}
.g.sq{border-radius:6px}
.g svg{width:13px;height:13px}

/* launch overlay */
.launch{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(10,10,12,.0);pointer-events:none;transition:background .35s ease}
.launch.on{background:rgba(10,10,12,.82);pointer-events:auto}
.launch div{opacity:0;transform:translateY(10px);transition:opacity .3s ease .1s,transform .3s ease .1s;text-align:center}
.launch.on div{opacity:1;transform:none}
.launch small{display:block;color:var(--muted);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.launch b{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:clamp(24px,4vh + 1vw,44px)}
.cart.insert{transform:translateY(-140%) scale(1.14);transition:transform .45s cubic-bezier(.5,0,.75,0)}

/* empty state */
.empty{position:fixed;inset:0;z-index:1;overflow:auto;-webkit-user-select:text;user-select:text;
  padding:calc(40px + env(safe-area-inset-top,0px)) var(--sr) 40px var(--sl);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6vw;align-items:center}
.empty .art svg{width:100%;max-width:520px;height:auto;display:block;margin-left:auto}
.empty h2{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(28px,5vh,46px);line-height:1.04;margin:16px 0 12px}
.empty p{color:var(--muted);line-height:1.6;margin:0 0 18px;max-width:440px}
.empty ol{color:var(--muted);line-height:1.8;padding-left:20px;margin:0 0 26px}
.empty b{color:var(--fg);font-weight:600}
.primary{background:var(--accent);color:#1a1408;font-weight:600;font-size:16px;padding:14px 22px;border-radius:12px;display:inline-block;cursor:pointer}
@media (max-aspect-ratio:1/1){.empty{grid-template-columns:1fr}.empty .art{display:none}}

.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);
  padding:12px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 48px);z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function thumbURL(system,label,kind="Named_Boxarts"){
  const clean = label.replace(/[&*\/:`<>?\\|"]/g,"_");
  return "https://thumbnails.libretro.com/"+encodeURIComponent(system)+"/"+kind+"/"+encodeURIComponent(clean)+".png";
}
function fileOf(path){ return (path||"").split("#")[0].split(/[\\/]/).pop(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function splitTitle(label){ const m=label.match(/^(.*?)\s*(\(.*)$/); return m?[m[1], m[2].split(/[()\[\]]/).map(s=>s.trim()).filter(Boolean)]:[label,[]]; }
function letterOf(label){ const c=label.replace(/^(the|a)\s+/i,"").trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:"#"; }
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }

function glyph(btn){

  if(btn==="LR") return `<span class="g sq">${padKind==="ps"?"L1":padKind==="nintendo"?"L":"LB"}</span><span class="g sq">${padKind==="ps"?"R1":padKind==="nintendo"?"R":"RB"}</span>`;

  const t = padKind==="ps"?ps[btn]:padKind==="nintendo"?nin[btn]:btn;
  if(!padKind) return `<span class="g sq">${btn==="A"?"Return":"Esc"}</span>`;
  return `<span class="g">${t}</span>`;
}

function sizeGames(){
  if(!els.games) return;
  const H=els.stage.clientHeight, W=els.stage.clientWidth;
  const rail=Math.round(Math.max(110,Math.min(H*.42,300)));
  els.games.style.setProperty("--rail", rail+"px");
  const ct=CART[info(sys().system).cart]||CART.other;
  const ch=rail*.66, cw=ch*ct.w/ct.h;
  els.ch=ch; els.cw=cw; els.step=cw+Math.max(14,cw*.16);
  const heroH=H-rail;
  els.games.style.setProperty("--boxw", Math.min(heroH*.82, W*.34)+"px");
  els.carts.forEach(el=>el.remove()); els.carts.clear();
}
function cartEl(k){
  const s=sys(), g=s.games[k], type=info(s.system).cart, ct=CART[type]||CART.other;
  const el=document.createElement("div");
  el.className="cart"+(ct.disc?" disc":""); el.dataset.i=k;
  el.style.width=els.cw+"px"; el.style.height=els.ch+"px"; el.style.left=(k*els.step)+"px";
  const [name]=splitTitle(g.label);
  let shell="", lab="";
  if(!ct.disc){
    shell=`<svg viewBox="0 0 ${ct.w} ${ct.h}" preserveAspectRatio="none" aria-hidden="true">${SHELLCACHE[type] ||= ct.shell()}</svg>`;
    const [x,y,w,h,r]=ct.label;
    lab=`left:${x/ct.w*100}%;top:${y/ct.h*100}%;width:${w/ct.w*100}%;height:${h/ct.h*100}%;border-radius:${r/ct.w*els.cw}px`;
  }
  const band = ct.band==="snes"?`<div class="band"><svg viewBox="0 0 20 20">${C(10,4.5,3.6,"#3c58d6")+C(15.5,10,3.6,"#d93339")+C(10,15.5,3.6,"#f1c22e")+C(4.5,10,3.6,"#2e9b52")}</svg><b></b></div>`
             : ct.band==="n64"?`<div class="band dark"><b></b></div>`
             : ct.band==="gb"||ct.band==="gbc"?`<div class="band ${ct.band==="gbc"?"dark":""}"><b style="max-width:70%"></b></div>`:"";
  el.innerHTML = shell + `<div class="label${band?" withband":""}" style="${lab}">${band}</div>`;
  const label=el.lastChild, url=thumbURL(s.system,g.label);
  const fb=()=>{ const f=document.createElement("div"); f.className="fb"; f.style.setProperty("--fbc",fbColor(name)); f.style.setProperty("--fbs",Math.max(9,els.ch*.085)+"px"); f.textContent=name; label.appendChild(f); };
  if(failed.has(url)) fb(); else {
    const img=new Image(); img.alt=""; img.decoding="async"; img.draggable=false;
    img.onerror=()=>{ failed.add(url); img.remove(); fb(); };
    img.src=url; label.appendChild(img);
  }
  return el;
}

function updateGames(first){

  /* keep only the carts near the focus in the DOM */
  for(const [k,el] of els.carts) if(Math.abs(k-gi)>WIN){ el.remove(); els.carts.delete(k); }
  for(let k=Math.max(0,gi-WIN);k<=Math.min(n-1,gi+WIN);k++) if(!els.carts.has(k)){ const el=cartEl(k); els.carts.set(k,el); els.track.appendChild(el); }
  for(const [k,el] of els.carts) el.classList.toggle("on",k===gi);
  els.track.classList.toggle("jump",!!first);
  els.track.style.transform=`translateX(${els.rail.clientWidth/2-(gi*els.step+els.cw/2)}px)`;
  if(first) requestAnimationFrame(()=>els.track.classList.remove("jump"));

  const [name,tags]=splitTitle(g.label);
  els.title.textContent=name;
  els.chips.innerHTML=tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("");
  els.count.textContent=`${gi+1} / ${n}`;
  clearTimeout(heroTimer);
  heroTimer=setTimeout(()=>{ setBox(s.system,g.label,name); setSnap(thumbURL(s.system,g.label,"Named_Snaps")); }, first?0:140);
  ui.pos[s.system]=gi; saveUI();
}
function setBox(system,label,name){
  const url=thumbURL(system,label);
  const nobox=()=>{ els.box.innerHTML=`<div class="nobox" style="--fbc:${fbColor(name)}">${esc(name)}</div>`; };
  if(failed.has(url)) return nobox();
  const img=new Image(); img.alt=""; img.className="loading"; img.draggable=false;
  img.onload=()=>{ if(els.box.contains(img)) img.classList.remove("loading"); };
  img.onerror=()=>{ failed.add(url); if(els.box.contains(img)) nobox(); };
  img.src=url;
  els.box.innerHTML=""; els.box.appendChild(img);
}
let snapFlip=false, snapWant=null;
function setSnap(url){
  snapWant=url;
  const a=$("snapA"), b=$("snapB");
  if(!url || failed.has(url)){ a.classList.remove("on"); b.classList.remove("on"); return; }
  const img=new Image();
  img.onload=()=>{ if(snapWant!==url) return; snapFlip=!snapFlip; const show=snapFlip?a:b, hide=snapFlip?b:a;
    show.style.backgroundImage=`url("${url}")`; show.classList.add("on"); hide.classList.remove("on"); };
  img.onerror=()=>{ failed.add(url); if(snapWant===url){ a.classList.remove("on"); b.classList.remove("on"); } };
  img.src=url;
}
function showLetter(){
  els.letter.textContent=sys().keys[gi]; els.letter.classList.add("on");
  clearTimeout(letterTimer); letterTimer=setTimeout(()=>els.letter.classList.remove("on"),500);
}

/* ---------- input ---------- */
let launching=false;
function input(a){
  if(launching || !library.length) return;
  if(view==="consoles"){
    if(a==="left"&&ci>0){ ci--; updateConsoles(); }
    else if(a==="right"&&ci<library.length-1){ ci++; updateConsoles(); }
    else if(a==="ok"){ history.pushState({v:"games"},""); buildGames(); }
  } else {
    const s=sys(), n=s.games.length;
    if(a==="left"&&gi>0){ gi--; updateGames(); }
    else if(a==="right"&&gi<n-1){ gi++; updateGames(); }
    else if(a==="next"||a==="down"){ const k=s.keys[gi]; let j=gi; while(j<n&&s.keys[j]===k) j++; if(j<n){ gi=j; updateGames(); showLetter(); } }
    else if(a==="prev"||a==="up"){ let j=gi; const k=s.keys[gi]; if(j>0&&s.keys[j-1]===k){ while(j>0&&s.keys[j-1]===k) j--; } else if(j>0){ j--; const k2=s.keys[j]; while(j>0&&s.keys[j-1]===k2) j--; } if(j!==gi){ gi=j; updateGames(); showLetter(); } }
    else if(a==="ok") launch();
    else if(a==="back") history.back();
  }
}
function launch(){
  const s=sys(), g=s.games[gi], [name]=splitTitle(g.label);
  launching=true;
  const el=els.carts.get(gi); if(el) el.classList.add("insert");
  $("launchTitle").textContent=name; $("launch").classList.add("on");
  setTimeout(()=>{ location.href="retroarch://game/"+encodeURIComponent(g.file); }, 420);
  setTimeout(endLaunch, 2600);
}
function endLaunch(){
  if(!launching) return; launching=false;
  $("launch").classList.remove("on");
  if(els.carts){ const el=els.carts.get(gi); if(el) el.classList.remove("insert"); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ endLaunch(); padReset(); } });

window.addEventListener("popstate",()=>{
  const want=(history.state&&history.state.v)||"consoles";
  if(want!==view && library.length){ if(want==="games") buildGames(); else buildConsoles(); }
});

addEventListener("keydown",e=>{
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",Enter:"ok"," ":"ok",Escape:"back",Backspace:"back",PageUp:"prev",PageDown:"next",q:"prev",e:"next"};
  const a=map[e.key]; if(!a) return;
  e.preventDefault(); input(a);
});

/* swipe on the stage */
let sx=null, sy=0, st=0;
addEventListener("pointerdown",e=>{ if(e.target.closest(".stage")){ sx=e.clientX; sy=e.clientY; st=Date.now(); } });
addEventListener("pointerup",e=>{
  if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)) return;
  const step = view==="games"?els.step:(els.cw||300)*.78;
  const fast = Date.now()-st<220 ? 2 : 1;
  const nsteps = Math.max(1,Math.round(Math.abs(dx)/step*fast));
  for(let i=0;i<nsteps;i++) input(dx<0?"right":"left");
  suppressClick=true; setTimeout(()=>suppressClick=false,50);
});
let suppressClick=false;
addEventListener("click",e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } },true);

/* Gamepad: standard mapping. Bottom face button confirms, right face button goes back. */
const BTN={0:"ok",1:"back",4:"prev",5:"next",6:"prev",7:"next",12:"up",13:"down",14:"left",15:"right"};
const REPEATS=new Set(["left","right","up","down","prev","next"]);
const held={}; let prevPressed={};
function padReset(){ prevPressed={}; for(const k in held) delete held[k]; ignoreUntilRelease=true; }
let ignoreUntilRelease=false;
function detectKind(id){ id=id.toLowerCase();
  if(/054c|playstation|dualshock|dualsense|wireless controller/.test(id)) return "ps";
  if(/057e|nintendo|pro controller|joy-con/.test(id)) return "nintendo";
  return "xbox"; }
function poll(){
  const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  const now=performance.now(), pressed={};
  for(const p of pads){
    for(const [i,a] of Object.entries(BTN)) if(p.buttons[i]&&p.buttons[i].pressed) pressed[a]=true;
    const x=p.axes[0]||0, y=p.axes[1]||0;
    if(x<-.55) pressed.left=true; if(x>.55) pressed.right=true;
    if(y<-.7) pressed.up=true; if(y>.7) pressed.down=true;
  }
  const kind = pads.length?detectKind(pads[0].id):null;
  if(kind!==padKind){ padKind=kind; if(library.length) refreshHints(); }
  if(ignoreUntilRelease){ if(!Object.keys(pressed).length) ignoreUntilRelease=false; }
  else for(const a in pressed){
    if(!prevPressed[a]){ input(a); held[a]=now+380; }
    else if(REPEATS.has(a) && now>=held[a]){
      input(a);
      const t=now-(held[a]-380); held[a]=now+(a==="left"||a==="right"?(t>1600?45:t>700?75:110):220);
    }
  }
  prevPressed=pressed;
  requestAnimationFrame(poll);
}
function refreshHints(){
  document.body.classList.toggle("has-pad",!!padKind);
  if(!els.hints) return;
  if(view==="games"){ setHints([["dpad","Browse"],["LR","Jump letter"],["A","Play"],["B","Back"]]); const p=els.games&&els.games.querySelector(".play"); if(p) p.innerHTML=playLabel(); }
  else setHints([["dpad","Choose"],["A","Open"]]);
}
addEventListener("gamepadconnected",()=>{});
requestAnimationFrame(poll);

/* clock */
function tick(){ const c=$("clock"); if(c) c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
setInterval(tick, 15000);

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(view==="games"&&els.games){ sizeGames(); updateGames(true); } else if(els.carousel){ sizeConsoles(); updateConsoles(true); }
},80); });

let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3000); }

$("lpl").addEventListener("change", async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const next=[...library]; let added=0; const bad=[];
  for(const f of files){
    try{
      const data=JSON.parse(await f.text());
      const fallback=f.name.replace(/\.lpl$/i,"");
      const by={};
      (data.items||[]).forEach(it=>{
        const s=(it.db_name||"").replace(/\.lpl$/i,"")||fallback;
        (by[s] ||= []).push({label:it.label||fileOf(it.path).replace(/\.[^.]+$/,""), file:fileOf(it.path)});
      });
      for(const [s,games] of Object.entries(by)){
        games.sort((a,b)=>a.label.localeCompare(b.label));
        const i=next.findIndex(x=>x.system===s);
        if(i>=0) next[i]={system:s,games}; else next.push({system:s,games});
        added+=games.length;
      }
    }catch(err){ bad.push(f.name); }
  }
  library=next.sort((a,b)=>info(a.system).order-info(b.system).order || a.system.localeCompare(b.system));
  library.forEach(s=>delete s.keys);
  save(); view="consoles"; ci=Math.max(0,library.findIndex(s=>s.system===ui.sys)); history.replaceState({v:"consoles"},""); render();
  toast(bad.length?`Couldn't read ${bad.join(", ")}. Pick the .lpl files in RetroArch › playlists.`:`Loaded ${added} games`);
  e.target.value="";
});

history.replaceState({v:"consoles"},"");
render();
</script>
